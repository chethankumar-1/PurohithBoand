version: '3.9'

services:

  # ---------------- ORACLE LOCAL ----------------
  oracle-local:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-local
    environment:
      ORACLE_PASSWORD: root
      ORACLE_PDB: XEPDB1
      ORACLE_CHARACTERSET: AL32UTF8
    ports:
      - "1522:1521"
    volumes:
      - oracle_local_data:/opt/oracle/oradata
    networks:
      - purohith-net
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- ORACLE PROD ----------------
  oracle-prod:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-prod
    environment:
      ORACLE_PASSWORD: prodpass
      ORACLE_PDB: XEPDB1
      ORACLE_CHARACTERSET: AL32UTF8
    ports:
      - "1523:1521"
    volumes:
      - oracle_prod_data:/opt/oracle/oradata
    networks:
      - purohith-net
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- BACKEND LOCAL ----------------
  backend-local:
    build: ./backend
    container_name: purohith-backend-local
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      SERVER_ADDRESS: 0.0.0.0
    depends_on:
      oracle-local:
        condition: service_healthy
    networks:
      - purohith-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      retries: 5

  # ---------------- BACKEND PROD ----------------
  backend-prod:
    build: ./backend
    container_name: purohith-backend-prod
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SERVER_ADDRESS: 0.0.0.0
    depends_on:
      oracle-prod:
        condition: service_healthy
    networks:
      - purohith-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      retries: 5

# ---------------- VOLUMES ----------------
volumes:
  oracle_local_data:
  oracle_prod_data:

# ---------------- NETWORK ----------------
networks:
  purohith-net:
    driver: bridge